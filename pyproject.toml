[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biscuit-quant"
version = "0.1.0"
description = "Reproducible offline A-share quant research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3", "numpy>=1.26,<3"]
dev = ["ruff>=0.8,<1", "build>=1.2,<2"]

[project.scripts]
biscuit = "biscuit_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
